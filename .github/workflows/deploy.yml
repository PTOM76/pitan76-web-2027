name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd
      - name: Check PHP syntax
        run: for f in build.php src/*.php templates/*.php templates/partials/*.php; do php -l "$f"; done
      - id: pages
        uses: actions/configure-pages@v5
      # data/ の検証もビルドの中で行う。公開先のパスと URL は Pages の設定から渡す
      - name: Generate static site
        run: php build.php
        env:
          PITAN_BASE: ${{ steps.pages.outputs.base_path }}/
          PITAN_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
